<li class="post-card">
  <article>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p class="post-meta">{{ include.post.date | date: "%B %-d, %Y" }}</p>
    {% if include.post.excerpt %}
      <p>{{ include.post.excerpt | strip_html | truncate: 180 }}</p>
    {% endif %}
  </article>
</li>
