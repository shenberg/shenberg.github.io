---
layout: default
---
<section class="blog-index">
  <h1>{{ page.title }}</h1>

  {% if site.posts.size > 0 %}
    <ul class="post-list">
      {% for post in site.posts %}
        {% include post_card.html post=post %}
      {% endfor %}
    </ul>
  {% else %}
    <p>No posts yet.</p>
  {% endif %}
</section>
